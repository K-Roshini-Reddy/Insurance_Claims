project:
  name: insurance-claims-fraud-scoring-platform
  version: "0.1.0"

api:
  host: "0.0.0.0"
  port: 8000

features:
  vin_enrichment_enabled: true

model:
  # Step 4.8: default to MLflow registry serving
  source: "local" # "mlflow" or "local"

  # Local (CI / laptop) model path
  local_path: "artifacts/models/fraud_model.joblib"
  local_name: "fraud_model"
  required: true

  default_threshold: 0.50
  positive_label: "FRAUD_RISK"
  negative_label: "LOW_RISK"

  # MLflow registry config
  mlflow_tracking_uri: "http://127.0.0.1:5000"
  registry_name: "fraud_scoring_model"
  stage: "Staging" # change to "Production" when ready

ab_test:
  enabled: false

  # Shadow mode only in Step 4.9
  mode: "shadow" # "shadow" or "split" (we do shadow now)

  challenger:
    registry_name: "fraud_scoring_model"
    stage: "Staging"

observability:
  enabled: true
  shadow_log_path: "artifacts/observability/shadow.jsonl"
