name: CI - Backend + Docker

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-smoke:
    name: Backend smoke test (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Import app (basic)
        run: |
          python -c "from backend.app.main import app; print('app_import_ok')"

      - name: Run minimal HTTP test (health)
        run: |
          python backend/tests/test_health.py

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t fraud-api:ci -f backend/Dockerfile .
