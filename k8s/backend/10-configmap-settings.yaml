apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-settings
  namespace: fraud
data:
  settings.yaml: |
    project:
      name: insurance-claims-fraud-scoring-platform
      version: "0.1.0"

    api:
      host: "0.0.0.0"
      port: 8000

    features:
      vin_enrichment_enabled: true

    model:
      source: "local"
      local_path: "model_store/fraud_model.joblib"
      local_name: "fraud_model"
      required: true

      default_threshold: 0.50
      positive_label: "FRAUD_RISK"
      negative_label: "LOW_RISK"

      mlflow_tracking_uri: "http://127.0.0.1:5000"
      registry_name: "fraud_scoring_model"
      stage: "Staging"

    ab_test:
      enabled: false
      mode: "shadow"
      challenger:
        registry_name: "fraud_scoring_model"
        stage: "Staging"

    observability:
      enabled: true
      shadow_log_path: "artifacts/observability/shadow.jsonl"
